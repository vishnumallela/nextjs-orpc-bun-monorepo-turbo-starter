services:
  postgres:
    image: postgres:16
    ports:
      - 5434:5432
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
  redis:
    image: redis:latest
    ports:
      - 6379:6379
    environment:
      REDIS_USERNAME: admin
      REDIS_PASSWORD: password
    volumes:
      - redis_data:/data
  mongodb:
    image: mongo:latest
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
    volumes:
      - mongodb_data:/data/db

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - 6333:6333
    environment:
      QDRANT_AUTH_SECRET: password
    volumes:
      - qdrant_data:/data

  minio:
    image: minio/minio:latest
    ports:
      - 9000:9000
      - 9001:9001
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password
    volumes:
      - minio_data:/data
volumes:
  postgres_data:
  redis_data:
  mongodb_data:
  qdrant_data:
  minio_data:
